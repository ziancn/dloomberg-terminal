name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: ["main"]

# 显式允许 Node.js 24 运行环境，消除 deprecation 警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # 升级到 v4，对较新版 pnpm 兼容性更好
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # 顺手升级到最新的 Node.js 24 LTS
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile # 避免因本地锁文件微小差异导致 CI 挂掉

      - name: Build with Next.js
        run: pnpm run build

      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages