name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: ["main"] # 监听 main 分支的 push 操作（根据你的主分支名字调整）

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # 你可以根据本地环境调整 pnpm 版本

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 推荐使用 LTS 版本
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build with Next.js
        run: pnpm run build # 这会在项目根目录生成一个 `out` 文件夹

      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out # Next.js 静态导出的默认目录
          publish_branch: gh-pages # 你想要托管静态文件的目标分支